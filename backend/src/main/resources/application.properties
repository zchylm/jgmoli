spring.application.name=jgmoli-backend
spring.profiles.default=local
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.flyway.locations=classpath:db/migration
spring.datasource.hikari.maximum-pool-size=${JGMOLI_DB_POOL_SIZE:5}
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Australia/Melbourne'

jgmoli.auth.jwt-secret=${JGMOLI_JWT_SECRET:local-development-secret-change-before-deploying-please-use-a-long-random-value}
jgmoli.auth.jwt-expiration-hours=${JGMOLI_JWT_EXPIRATION_HOURS:24}
jgmoli.cors.allowed-origins=${JGMOLI_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:5176,http://127.0.0.1:5176}
jgmoli.invoice.seller-legal-name=${JGMOLI_INVOICE_LEGAL_NAME:AI CYBER AUSTRALIA PTY LTD}
jgmoli.invoice.seller-trading-name=${JGMOLI_INVOICE_TRADING_NAME:JG MOLI}
jgmoli.invoice.seller-abn=${JGMOLI_INVOICE_ABN:22 689 546 450}
jgmoli.invoice.seller-address=${JGMOLI_INVOICE_ADDRESS:205 Kensington Rd, West Melbourne VIC 3003, Australia}
jgmoli.invoice.seller-email=${JGMOLI_INVOICE_EMAIL:sales@aicybermedia.com.au}
jgmoli.invoice.seller-phone=${JGMOLI_INVOICE_PHONE:+61 436 365 016}
jgmoli.ai.claude.api-key=${JGMOLI_CLAUDE_API_KEY:}
jgmoli.ai.claude.model=${JGMOLI_CLAUDE_MODEL:claude-sonnet-5}
jgmoli.ai.claude.base-url=${JGMOLI_CLAUDE_BASE_URL:https://api.anthropic.com}
