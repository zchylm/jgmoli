spring.datasource.url=${JGMOLI_DB_URL}
spring.datasource.username=${JGMOLI_DB_USERNAME}
spring.datasource.password=${JGMOLI_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Production must explicitly provide a strong JWT secret and the deployed frontend origins.
jgmoli.auth.jwt-secret=${JGMOLI_JWT_SECRET}
jgmoli.cors.allowed-origins=${JGMOLI_CORS_ALLOWED_ORIGINS}
jgmoli.payment.demo-enabled=false
